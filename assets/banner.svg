<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glowing Line Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#3b82f6;#8b5cf6;#06b6d4" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#3b82f6">
        <animate attributeName="stop-color" values="#3b82f6;#8b5cf6;#06b6d4;#3b82f6" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#06b6d4;#3b82f6;#8b5cf6" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .dash-flow {
        stroke-dasharray: 8 6;
        animation: flow 20s linear infinite;
      }
      .reverse-flow {
        stroke-dasharray: 6 8;
        animation: rflow 15s linear infinite;
      }
      @keyframes flow {
        to { stroke-dashoffset: -200; }
      }
      @keyframes rflow {
        to { stroke-dashoffset: 200; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Geometric Grid Accent -->
  <g opacity="0.12" stroke="#94a3b8" stroke-width="1">
    <path d="M 0,40 L 1200,40 M 0,80 L 1200,80 M 0,120 L 1200,120 M 0,160 L 1200,160 M 0,200 L 1200,200 M 0,240 L 1200,240 M 0,280 L 1200,280" />
    <path d="M 100,0 L 100,320 M 200,0 L 200,320 M 300,0 L 300,320 M 400,0 L 400,320 M 500,0 L 500,320 M 600,0 L 600,320 M 700,0 L 700,320 M 800,0 L 800,320 M 900,0 L 900,320 M 1000,0 L 1000,320 M 1100,0 L 1100,320" />
  </g>

  <!-- Dynamic Supply Chain Nodes & Connecting Flow Lines -->
  <g opacity="0.6">
    <path d="M 50,220 C 200,280 350,140 500,200 C 650,260 850,120 1150,180" fill="none" stroke="url(#cyanPurple)" stroke-width="2.5" class="dash-flow" filter="url(#softGlow)"/>
    <path d="M 80,100 C 250,40 400,180 600,100 C 800,20 950,160 1120,80" fill="none" stroke="url(#cyanPurple)" stroke-width="1.8" class="reverse-flow" opacity="0.7"/>
  </g>

  <!-- Floating Glowing Quality / Supply Chain Nodes -->
  <g filter="url(#glow)">
    <circle cx="120" cy="180" r="5" fill="#38bdf8">
      <animate attributeName="r" values="4;7;4" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="340" cy="240" r="6" fill="#818cf8">
      <animate attributeName="r" values="5;8;5" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="500" cy="200" r="7" fill="#10b981">
      <animate attributeName="r" values="6;9;6" dur="5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;1;0.6" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="850" cy="120" r="6" fill="#06b6d4">
      <animate attributeName="r" values="4;8;4" dur="4.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="1060" cy="210" r="5" fill="#c084fc">
      <animate attributeName="r" values="4;7;4" dur="3.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Top Badge / Header Ribbon -->
  <g transform="translate(60, 48)">
    <rect width="210" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="16" cy="14" r="5" fill="#10b981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="18" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1">CURATED ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(60, 120)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Awesome <tspan fill="url(#cyanPurple)">Supplier Quality Management</tspan>
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(60, 160)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#94a3b8" font-weight="400">
      Enterprise SaaS Platforms, eQMS Solutions &amp; Open-Source Quality Ecosystems
    </text>
  </g>

  <!-- Feature Tags / Pills -->
  <g transform="translate(60, 205)">
    <g transform="translate(0, 0)">
      <rect width="165" height="34" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" opacity="0.9"/>
      <text x="14" y="21" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">🔍 Audits &amp; Qual</text>
    </g>
    <g transform="translate(177, 0)">
      <rect width="135" height="34" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2" opacity="0.9"/>
      <text x="14" y="21" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">⚡ CAPA &amp; NCR</text>
    </g>
    <g transform="translate(324, 0)">
      <rect width="150" height="34" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.2" opacity="0.9"/>
      <text x="14" y="21" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">🛡️ Supplier Risk</text>
    </g>
    <g transform="translate(486, 0)">
      <rect width="210" height="34" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2" opacity="0.9"/>
      <text x="14" y="21" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">📜 ISO 9001 • IATF 16949</text>
    </g>
    <g transform="translate(708, 0)">
      <rect width="180" height="34" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2" opacity="0.9"/>
      <text x="14" y="21" fill="#67e8f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">📦 PPAP &amp; Inspection</text>
    </g>
  </g>

  <!-- Right-side Quality Shield -->
  <g transform="translate(980, 50)" filter="url(#glow)">
    <path d="M 70,20 L 130,50 L 130,130 C 130,180 70,210 70,210 C 70,210 10,180 10,130 L 10,50 Z" 
          fill="#1e293b" stroke="url(#shieldGrad)" stroke-width="3" opacity="0.85">
      <animate attributeName="stroke-width" values="2.5;4;2.5" dur="4s" repeatCount="indefinite" />
    </path>
    <path d="M 42,112 L 62,132 L 100,85" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
